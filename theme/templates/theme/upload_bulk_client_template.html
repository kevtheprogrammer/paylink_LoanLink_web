{% extends 'theme/base.html' %}

{% block title %} Upload Bulk Client Template {% endblock %}

{% block content %}

<body class="bg-gray-100 py-10">
    <div class="container mx-auto p-6 bg-white rounded-lg shadow-lg">
        <h1 class="text-2xl font-semibold mb-6 text-slate-900">Upload Bulk Client Template</h1>
        
        <form action="{% url 'upload-clients' %}" method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div id="drop-area" class="flex flex-col justify-center items-center border-2 border-dashed border-slate-400 rounded-md p-6 bg-slate-50 hover:bg-slate-100">
                <p id="dragText" class="text-gray-500">Drag & Drop your file here or click to upload</p>
                <input id="fileInput" type="file" name="file" class="hidden" />
            </div>
            <input id="fileInput" type="file" name="file" class="btn"/>
            <button type="submit" class="inline-flex items-center justify-center rounded-md border border-transparent bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900">
                Upload
            </button>
        </form>
    </div>
</body>


{% endblock %}
